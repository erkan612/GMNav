<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The three kinds of connection between ledges</title>
<desc>Walking along a ledge, stepping off an edge and falling, and jumping. Each is priced in frames so the search can compare them fairly.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="50" y="150" width="150" height="16" fill="#5F5E5A"/>
<circle cx="80" cy="142" r="7" fill="#D85A30"/>
<line x1="88" y1="142" x2="172" y2="142" stroke="#F0F0F0" stroke-width="3"/>
<line x1="88" y1="142" x2="172" y2="142" stroke="#5F5E5A" stroke-width="2.5"/>
<circle cx="180" cy="142" r="6" fill="#1D9E75"/>
<text x="125" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">WALK</text>
<text x="125" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">along a ledge</text>
<text x="125" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">one tile costs 5.33 frames</text>

<rect x="250" y="110" width="90" height="16" fill="#5F5E5A"/>
<rect x="340" y="200" width="110" height="16" fill="#5F5E5A"/>
<circle cx="280" cy="102" r="7" fill="#D85A30"/>
<path d="M288 102 L338 102 Q356 130 368 192" fill="none" stroke="#0F6E56" stroke-width="2.5"/>
<circle cx="370" cy="192" r="6" fill="#1D9E75"/>
<text x="350" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">FALL</text>
<text x="350" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">walk to the edge, then gravity</text>

<rect x="490" y="200" width="70" height="16" fill="#5F5E5A"/>
<rect x="600" y="150" width="60" height="16" fill="#5F5E5A"/>
<circle cx="515" cy="192" r="7" fill="#D85A30"/>
<path d="M523 190 Q570 108 622 142" fill="none" stroke="#D85A30" stroke-width="2.5"/>
<circle cx="625" cy="142" r="6" fill="#1D9E75"/>
<text x="570" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">JUMP</text>
<text x="570" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">a simulated ballistic arc</text>

<text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Every link is priced in frames, so walking twenty tiles and dropping off a ledge can be compared honestly.</text>
</svg>
