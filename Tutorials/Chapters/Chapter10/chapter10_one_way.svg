<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A graph that only runs downhill</title>
<desc>A drop of sixty four pixels is easy going down and impossible coming back up, so the link exists in one direction only.</desc>
<defs><marker id="a10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="270" fill="#ffffff"/>

<rect x="200" y="70" width="180" height="16" fill="#5F5E5A"/>
<rect x="330" y="180" width="180" height="16" fill="#5F5E5A"/>
<text x="290" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">high shelf</text>
<text x="420" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">mid ledge</text>

<path d="M372 66 Q400 100 400 172" fill="none" stroke="#0F6E56" stroke-width="2.5" marker-end="url(#a10)"/>
<text x="440" y="120" font-family="sans-serif" font-size="12" fill="#085041">down, easy</text>

<path d="M340 172 Q310 130 310 96" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="296" y1="118" x2="324" y2="146" stroke="#993C1D" stroke-width="2.5"/>
<line x1="324" y1="118" x2="296" y2="146" stroke="#993C1D" stroke-width="2.5"/>
<text x="150" y="140" font-family="sans-serif" font-size="12" fill="#712B13">up, impossible</text>

<rect x="40" y="228" width="600" height="34" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="250" font-family="sans-serif" font-size="12" fill="#2C2C2A">The shelf is 64 pixels above the ledge. This character's peak rise is 60. Unreachable is a normal, expected result here.</text>
</svg>
