<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What a frame can afford</title>
<desc>A frame at sixty per second lasts about sixteen milliseconds and must also run everything else in the game. Two hundred searches finishing in one frame vastly overruns it.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<text x="40" y="46" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">One frame at 60 fps</text>
<rect x="40" y="58" width="360" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="40" y="58" width="150" height="34" rx="6" fill="#DCD9CE"/>
<text x="115" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#2C2C2A">your game</text>
<text x="295" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">room to spare</text>
<text x="412" y="80" font-family="sans-serif" font-size="12" fill="#5F5E5A">16.6 ms</text>

<text x="40" y="128" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">200 searches, each run to completion</text>
<rect x="40" y="140" width="360" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<rect x="40" y="140" width="150" height="34" rx="6" fill="#DCD9CE"/>
<text x="115" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#2C2C2A">your game</text>
<rect x="190" y="140" width="210" height="34" fill="#993C1D" opacity="0.35"/>
<text x="295" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">37513 pops</text>
<path d="M400 157 L470 157" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 4"/>
<text x="480" y="161" font-family="sans-serif" font-size="12" fill="#712B13">and still going</text>

<text x="40" y="210" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">200 searches under a budget of 500 pops</text>
<rect x="40" y="222" width="360" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="40" y="222" width="150" height="34" rx="6" fill="#DCD9CE"/>
<text x="115" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#2C2C2A">your game</text>
<rect x="190" y="222" width="46" height="34" fill="#1D9E75" opacity="0.5"/>
<text x="213" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#04342C">500</text>
<text x="300" y="240" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#085041">the rest waits for the next frame</text>

<text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The work does not get smaller. It gets spread out, which is the only part your players can feel.</text>
</svg>
