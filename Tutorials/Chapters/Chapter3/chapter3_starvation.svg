<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A lower band starved by constant higher traffic</title>
<desc>When high priority requests arrive faster than workspaces free up, the backlog grows without limit and a lower priority request never reaches the front.</desc>
<rect width="680" height="270" fill="#ffffff"/>

<text x="40" y="44" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">8 HIGH requests arrive every frame, 4 workspaces free up every few frames</text>

<rect x="40" y="62" width="70" height="26" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="75" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">frame 1</text>
<rect x="118" y="62" width="40" height="26" rx="6" fill="#993C1D" opacity="0.3"/>

<rect x="40" y="98" width="70" height="26" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="75" y="112" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">frame 50</text>
<rect x="118" y="98" width="150" height="26" rx="6" fill="#993C1D" opacity="0.3"/>

<rect x="40" y="134" width="70" height="26" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="75" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">frame 300</text>
<rect x="118" y="134" width="470" height="26" rx="6" fill="#993C1D" opacity="0.3"/>
<text x="596" y="151" font-family="sans-serif" font-size="11" fill="#712B13">1738</text>

<rect x="40" y="176" width="70" height="26" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="75" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#26215C">one LOW</text>
<text x="126" y="193" font-family="sans-serif" font-size="12" fill="#3C3489">queued on frame 1, still waiting on frame 300</text>

<rect x="40" y="216" width="600" height="42" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="236" font-family="sans-serif" font-size="12" fill="#2C2C2A">Priority orders the queue, it does not create capacity.</text>
<text x="60" y="252" font-family="sans-serif" font-size="12" fill="#5F5E5A">If everything is urgent then nothing is, and the requests you actually cared about are stuck behind the ones you did not.</text>
</svg>
