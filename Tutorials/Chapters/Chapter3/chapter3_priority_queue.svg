<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How the waiting queue is ordered</title>
<desc>Requests are sorted into priority bands, and inside each band the oldest request goes first. Workspaces are taken from the top of the queue.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="320" fill="#ffffff"/>

<rect x="40" y="50" width="330" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="58" y="72" font-family="sans-serif" font-size="12" font-weight="500" fill="#712B13">HIGH</text>
<text x="58" y="90" font-family="sans-serif" font-size="11" fill="#993C1D">seq 41, seq 44, seq 52</text>

<rect x="40" y="112" width="330" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="58" y="134" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">NORMAL</text>
<text x="58" y="152" font-family="sans-serif" font-size="11" fill="#5F5E5A">seq 3, seq 4, seq 5, seq 6 ... seq 40</text>

<rect x="40" y="174" width="330" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="196" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C">LOW</text>
<text x="58" y="214" font-family="sans-serif" font-size="11" fill="#3C3489">seq 1, seq 2</text>

<line x1="378" y1="76" x2="430" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="440" y="96" width="200" height="130" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">workspaces</text>
<g fill="#B9EEDC" stroke="#0F6E56" stroke-width="0.5">
<rect x="462" y="138" width="72" height="30" rx="6"/>
<rect x="546" y="138" width="72" height="30" rx="6"/>
<rect x="462" y="178" width="72" height="30" rx="6"/>
<rect x="546" y="178" width="72" height="30" rx="6"/>
</g>
<text x="540" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">four searches can run at once</text>

<rect x="40" y="252" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="274" font-family="sans-serif" font-size="12" fill="#2C2C2A">Higher band first, then oldest first inside the band.</text>
<text x="60" y="292" font-family="sans-serif" font-size="12" fill="#5F5E5A">The sequence number is what stops a busy band from reshuffling itself forever and stranding its own oldest request.</text>
</svg>
