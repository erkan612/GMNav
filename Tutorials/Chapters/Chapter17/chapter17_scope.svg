<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="330" fill="#FBFAF7"/>
  <text x="340" y="32" text-anchor="middle" font-size="15" fill="#3A3A38">Whose business is this change?</text>

  <rect x="55" y="60" width="570" height="185" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>

  <rect x="468" y="148" width="78" height="58" fill="#D79A90" stroke="#A03A32" stroke-width="1.6"/>
  <text x="507" y="140" text-anchor="middle" font-size="12" fill="#A03A32">the edit</text>

  <polyline points="90,110 200,110 250,152 380,152" fill="none" stroke="#3E7D5A" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="90" cy="110" r="6" fill="#2F5F45"/>
  <circle cx="380" cy="152" r="6" fill="#2F5F45"/>

  <polyline points="360,232 455,232 512,180 612,180" fill="none" stroke="#C08A3E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="360" cy="232" r="6" fill="#8A5F22"/>
  <circle cx="612" cy="180" r="6" fill="#8A5F22"/>

  <text x="235" y="278" text-anchor="middle" font-size="13" fill="#3E7D5A">nowhere near it, carries on</text>
  <text x="500" y="278" text-anchor="middle" font-size="13" fill="#8A5F22">crosses it, asks again</text>

  <text x="340" y="310" text-anchor="middle" font-size="12.5" fill="#6B6B67">The grid remembers where it changed, so most agents never have to ask.</text>
</svg>
