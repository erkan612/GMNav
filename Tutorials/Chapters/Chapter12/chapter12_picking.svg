<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="320" fill="#FBFAF7"/>

  <text x="340" y="32" text-anchor="middle" font-size="15" fill="#3A3A38">One point, two answers</text>

  <rect x="90" y="215" width="500" height="50" fill="#D8E2C9" stroke="#B4C4A0" stroke-width="1.2"/>
  <text x="150" y="246" font-size="12.5" fill="#4A5940">the road, layer 0</text>

  <rect x="230" y="120" width="220" height="34" fill="#B9C3CE" stroke="#7F8C9B" stroke-width="1.5"/>
  <text x="276" y="142" text-anchor="middle" font-size="12.5" fill="#41505E">the deck, layer 1</text>

  <line x1="340" y1="60" x2="340" y2="265" stroke="#8A8A86" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="340" cy="66" r="5" fill="#3A3A38"/>
  <text x="352" y="70" font-size="12.5" fill="#3A3A38">the point you were given</text>

  <circle cx="340" cy="137" r="7" fill="#41505E"/>
  <circle cx="340" cy="240" r="7" fill="#4A5940"/>

  <text x="466" y="141" font-size="12.5" fill="#41505E">layer 1 answers here</text>
  <text x="466" y="244" font-size="12.5" fill="#4A5940">layer 0 answers here</text>

  <text x="340" y="300" text-anchor="middle" font-size="12.5" fill="#6B6B67">GMNav does not own your camera, so the caller says which surface it meant.</text>
</svg>
