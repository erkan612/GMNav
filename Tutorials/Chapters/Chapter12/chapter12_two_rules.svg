<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="360" fill="#FBFAF7"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#3A3A38">A link only where the layer changes</text>

  <text x="175" y="60" text-anchor="middle" font-size="13" fill="#C0483F">what people write</text>
  <text x="505" y="60" text-anchor="middle" font-size="13" fill="#3E7D5A">what is needed</text>

  <rect x="60" y="200" width="230" height="45" fill="#D8E2C9" stroke="#B4C4A0" stroke-width="1.2"/>
  <rect x="390" y="200" width="230" height="45" fill="#D8E2C9" stroke="#B4C4A0" stroke-width="1.2"/>

  <g stroke="#7F8C9B" stroke-width="1.2" fill="#B9C3CE">
    <rect x="95" y="125" width="40" height="34"/>
    <rect x="135" y="125" width="40" height="34"/>
    <rect x="175" y="125" width="40" height="34"/>
    <rect x="215" y="125" width="40" height="34"/>
    <rect x="425" y="125" width="40" height="34"/>
    <rect x="465" y="125" width="40" height="34"/>
    <rect x="505" y="125" width="40" height="34"/>
    <rect x="545" y="125" width="40" height="34"/>
  </g>

  <g stroke="#C0483F" stroke-width="2.2" fill="none">
    <path d="M 80 200 L 108 162"/>
    <path d="M 120 200 L 148 162"/>
    <path d="M 160 200 L 188 162"/>
    <path d="M 200 200 L 228 162"/>
  </g>

  <path d="M 410 200 L 438 162" stroke="#3E7D5A" stroke-width="2.8" fill="none"/>

  <g stroke="#7F8C9B" stroke-width="1.6" stroke-dasharray="4 3" fill="none">
    <path d="M 445 142 L 485 142"/>
    <path d="M 485 142 L 525 142"/>
    <path d="M 525 142 L 565 142"/>
  </g>

  <text x="175" y="290" text-anchor="middle" font-size="12.5" fill="#6B6B67">a link per cell</text>
  <text x="505" y="290" text-anchor="middle" font-size="12.5" fill="#6B6B67">one link at the foot</text>
  <text x="505" y="312" text-anchor="middle" font-size="12.5" fill="#6B6B67">the rest join by themselves</text>

  <text x="340" y="345" text-anchor="middle" font-size="12.5" fill="#6B6B67">Cells on one layer are neighbours already. Only the change of surface needs saying.</text>
</svg>
