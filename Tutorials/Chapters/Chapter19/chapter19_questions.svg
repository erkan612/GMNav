<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="400" fill="#FBFAF7"/>
  <text x="340" y="34" text-anchor="middle" font-size="15" fill="#3A3A38">Each view answers one question</text>

  <g font-size="12.5">
    <rect x="55" y="60" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="70" y="79" fill="#4A5940" font-size="13.5">draw_grid</text>
    <text x="70" y="97" fill="#6B6B67">is this cell solid?</text>

    <rect x="55" y="116" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="70" y="135" fill="#4A5940" font-size="13.5">draw_clearance</text>
    <text x="70" y="153" fill="#6B6B67">how much room is there?</text>

    <rect x="55" y="172" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="70" y="191" fill="#4A5940" font-size="13.5">draw_costs</text>
    <text x="70" y="209" fill="#6B6B67">what does this unit type pay?</text>

    <rect x="55" y="228" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="70" y="247" fill="#4A5940" font-size="13.5">draw_flowfield</text>
    <text x="70" y="265" fill="#6B6B67">which way, and how far?</text>

    <rect x="355" y="60" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="370" y="79" fill="#4A5940" font-size="13.5">draw_reach</text>
    <text x="370" y="97" fill="#6B6B67">can this size get there at all?</text>

    <rect x="355" y="116" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="370" y="135" fill="#4A5940" font-size="13.5">draw_search</text>
    <text x="370" y="153" fill="#6B6B67">where has it looked so far?</text>

    <rect x="355" y="172" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="370" y="191" fill="#4A5940" font-size="13.5">draw_agent</text>
    <text x="370" y="209" fill="#6B6B67">what is it steering at?</text>

    <rect x="355" y="228" width="270" height="46" rx="5" fill="#EDF0E8" stroke="#C9D2BE" stroke-width="1.2"/>
    <text x="370" y="247" fill="#4A5940" font-size="13.5">draw_stats</text>
    <text x="370" y="265" fill="#6B6B67">is the budget holding?</text>
  </g>

  <text x="340" y="320" text-anchor="middle" font-size="13" fill="#3A3A38">Reach for the view whose question matches your symptom.</text>
  <text x="340" y="348" text-anchor="middle" font-size="12.5" fill="#6B6B67">Turning them all on at once mostly produces a picture of everything,</text>
  <text x="340" y="368" text-anchor="middle" font-size="12.5" fill="#6B6B67">which answers nothing.</text>
</svg>
