<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What the agent does and what it leaves to you</title>
<desc>The agent reads the path and writes a velocity. Applying that velocity, and colliding with the world, stays your game's responsibility.</desc>
<defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="260" fill="#ffffff"/>

<rect x="40" y="60" width="250" height="110" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="86" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">gmnav_agent_update</text>
<text x="60" y="110" font-family="sans-serif" font-size="12" fill="#085041">picks the waypoint to steer at</text>
<text x="60" y="128" font-family="sans-serif" font-size="12" fill="#085041">eases toward the desired speed</text>
<text x="60" y="146" font-family="sans-serif" font-size="12" fill="#085041">writes vx and vy</text>

<line x1="298" y1="115" x2="378" y2="115" stroke="#73726c" stroke-width="1.5" marker-end="url(#a4)"/>
<text x="338" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">vx, vy</text>

<rect x="388" y="60" width="252" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="408" y="86" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">your object</text>
<text x="408" y="110" font-family="sans-serif" font-size="12" fill="#3C3489">applies them however it likes</text>
<text x="408" y="128" font-family="sans-serif" font-size="12" fill="#3C3489">runs your own collision</text>
<text x="408" y="146" font-family="sans-serif" font-size="12" fill="#3C3489">owns x and y, always</text>

<text x="340" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">A navigation library that moves your instances is a second collision system competing with the one you wrote.</text>
<text x="340" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">That is a fight it cannot win, so GMNav does not start it.</text>
</svg>
