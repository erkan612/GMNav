<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Walking straight at a target compared to following a path</title>
<desc>An enemy that moves directly toward the player gets stuck against a wall. An enemy following a computed path routes around the wall and arrives.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowgrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="320" fill="#ffffff"/>

<rect x="30" y="40" width="290" height="200" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="46" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Move straight at the target</text>

<rect x="175" y="90" width="26" height="120" rx="3" fill="#993C1D" opacity="0.55"/>
<circle cx="80" cy="150" r="9" fill="#D85A30"/>
<text x="80" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">enemy</text>
<circle cx="270" cy="150" r="9" fill="#1D9E75"/>
<text x="270" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">player</text>
<line x1="92" y1="150" x2="170" y2="150" stroke="#993C1D" stroke-width="2" marker-end="url(#arrowred)"/>
<text x="175" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">stuck against the wall, forever</text>

<rect x="360" y="40" width="290" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="376" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Follow a computed path</text>

<rect x="505" y="90" width="26" height="95" rx="3" fill="#0F6E56" opacity="0.45"/>
<circle cx="410" cy="150" r="9" fill="#D85A30"/>
<text x="410" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">enemy</text>
<circle cx="600" cy="150" r="9" fill="#1D9E75"/>
<text x="600" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">player</text>
<path d="M422 150 L470 150 L495 200 L545 200 L570 152" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrowgrn)"/>
<circle cx="470" cy="150" r="3" fill="#0F6E56"/>
<circle cx="495" cy="200" r="3" fill="#0F6E56"/>
<circle cx="545" cy="200" r="3" fill="#0F6E56"/>
<text x="505" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">around the wall, and arrives</text>

<text x="340" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The difference is not smarter movement, it is knowing the whole route before taking the first step.</text>
<text x="340" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Working that route out is what a pathfinder does.</text>
</svg>
