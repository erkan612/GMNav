<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A grid of tiles seen as a graph of nodes and connections</title>
<desc>Each walkable tile becomes a node. Each pair of touching walkable tiles becomes a connection. A wall tile is simply a node that does not exist.</desc>
<rect width="680" height="360" fill="#ffffff"/>

<text x="40" y="34" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Tiles</text>
<text x="390" y="34" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">The same tiles, as a graph</text>

<g stroke="#5F5E5A" stroke-width="0.5">
<rect x="40"  y="50" width="60" height="60" fill="#F1EFE8"/>
<rect x="100" y="50" width="60" height="60" fill="#F1EFE8"/>
<rect x="160" y="50" width="60" height="60" fill="#F1EFE8"/>
<rect x="220" y="50" width="60" height="60" fill="#FAECE7"/>
<rect x="40"  y="110" width="60" height="60" fill="#F1EFE8"/>
<rect x="100" y="110" width="60" height="60" fill="#F1EFE8"/>
<rect x="160" y="110" width="60" height="60" fill="#F1EFE8"/>
<rect x="220" y="110" width="60" height="60" fill="#FAECE7"/>
<rect x="40"  y="170" width="60" height="60" fill="#F1EFE8"/>
<rect x="100" y="170" width="60" height="60" fill="#F1EFE8"/>
<rect x="160" y="170" width="60" height="60" fill="#F1EFE8"/>
<rect x="220" y="170" width="60" height="60" fill="#F1EFE8"/>
</g>
<text x="250" y="84" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">wall</text>
<text x="250" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">wall</text>

<g stroke="#C7C4BA" stroke-width="1.5">
<line x1="420" y1="80" x2="480" y2="80"/><line x1="480" y1="80" x2="540" y2="80"/>
<line x1="420" y1="140" x2="480" y2="140"/><line x1="480" y1="140" x2="540" y2="140"/>
<line x1="420" y1="200" x2="480" y2="200"/><line x1="480" y1="200" x2="540" y2="200"/><line x1="540" y1="200" x2="600" y2="200"/>
<line x1="420" y1="80" x2="420" y2="140"/><line x1="480" y1="80" x2="480" y2="140"/><line x1="540" y1="80" x2="540" y2="140"/>
<line x1="420" y1="140" x2="420" y2="200"/><line x1="480" y1="140" x2="480" y2="200"/><line x1="540" y1="140" x2="540" y2="200"/>
<line x1="420" y1="80" x2="480" y2="140"/><line x1="480" y1="80" x2="420" y2="140"/>
<line x1="480" y1="80" x2="540" y2="140"/><line x1="540" y1="80" x2="480" y2="140"/>
<line x1="420" y1="140" x2="480" y2="200"/><line x1="480" y1="140" x2="420" y2="200"/>
<line x1="540" y1="140" x2="600" y2="200"/>
</g>
<g stroke="#0F6E56" stroke-width="2">
<line x1="480" y1="80" x2="540" y2="140"/><line x1="540" y1="140" x2="480" y2="200"/>
</g>

<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<circle cx="420" cy="80" r="11"/><circle cx="480" cy="80" r="11"/><circle cx="540" cy="80" r="11"/>
<circle cx="420" cy="140" r="11"/><circle cx="480" cy="140" r="11"/>
<circle cx="420" cy="200" r="11"/><circle cx="480" cy="200" r="11"/><circle cx="540" cy="200" r="11"/><circle cx="600" cy="200" r="11"/>
</g>
<circle cx="540" cy="140" r="13" fill="#1D9E75" stroke="#04342C" stroke-width="0.5"/>

<text x="480" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">this node touches 6 others</text>
<text x="480" y="273" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">two of its neighbours are walls, so those connections do not exist</text>

<rect x="40" y="286" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="308" font-family="sans-serif" font-size="12" fill="#26215C">Every walkable tile is a node. Every pair of touching walkable tiles is a connection.</text>
<text x="60" y="326" font-family="sans-serif" font-size="12" fill="#3C3489">Finding a route through a room is finding a chain of connections from one node to another.</text>
</svg>
