<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A search spreading outward from the start toward the goal</title>
<desc>The search settles cells nearest the start first, keeps a frontier of cells it has reached but not yet settled, and stops as soon as it settles the goal, leaving much of the map untouched.</desc>
<rect width="680" height="330" fill="#ffffff"/>

<g stroke="#ffffff" stroke-width="1">
