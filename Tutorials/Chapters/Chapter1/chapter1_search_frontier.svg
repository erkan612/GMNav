<rect x="120" y="74" width="24" height="24" fill="#DCD9CE"/><rect x="144" y="74" width="24" height="24" fill="#DCD9CE"/><rect x="168" y="74" width="24" height="24" fill="#DCD9CE"/><rect x="192" y="74" width="24" height="24" fill="#B9EEDC"/><rect x="216" y="74" width="24" height="24" fill="#F7F6F2"/><rect x="240" y="74" width="24" height="24" fill="#F7F6F2"/><rect x="264" y="74" width="24" height="24" fill="#F7F6F2"/><rect x="288" y="74" width="24" height="24" fill="#F7F6F2"/><rect x="312" y="74" width="24" height="24" fill="#F7F6F2"/><rect x="336" y="74" width="24" height="24" fill="#F7F6F2"/>
<rect x="120" y="98" width="24" height="24" fill="#DCD9CE"/><rect x="144" y="98" width="24" height="24" fill="#DCD9CE"/><rect x="168" y="98" width="24" height="24" fill="#DCD9CE"/><rect x="192" y="98" width="24" height="24" fill="#DCD9CE"/><rect x="216" y="98" width="24" height="24" fill="#B9EEDC"/><rect x="240" y="98" width="24" height="24" fill="#F7F6F2"/><rect x="264" y="98" width="24" height="24" fill="#F7F6F2"/><rect x="288" y="98" width="24" height="24" fill="#F7F6F2"/><rect x="312" y="98" width="24" height="24" fill="#F7F6F2"/><rect x="336" y="98" width="24" height="24" fill="#F7F6F2"/>
<rect x="120" y="122" width="24" height="24" fill="#DCD9CE"/><rect x="144" y="122" width="24" height="24" fill="#DCD9CE"/><rect x="168" y="122" width="24" height="24" fill="#DCD9CE"/><rect x="192" y="122" width="24" height="24" fill="#DCD9CE"/><rect x="216" y="122" width="24" height="24" fill="#B9EEDC"/><rect x="240" y="122" width="24" height="24" fill="#F7F6F2"/><rect x="264" y="122" width="24" height="24" fill="#F7F6F2"/><rect x="288" y="122" width="24" height="24" fill="#F7F6F2"/><rect x="312" y="122" width="24" height="24" fill="#F7F6F2"/><rect x="336" y="122" width="24" height="24" fill="#F7F6F2"/>
<rect x="120" y="146" width="24" height="24" fill="#DCD9CE"/><rect x="144" y="146" width="24" height="24" fill="#DCD9CE"/><rect x="168" y="146" width="24" height="24" fill="#DCD9CE"/><rect x="192" y="146" width="24" height="24" fill="#DCD9CE"/><rect x="216" y="146" width="24" height="24" fill="#DCD9CE"/><rect x="240" y="146" width="24" height="24" fill="#B9EEDC"/><rect x="264" y="146" width="24" height="24" fill="#B9EEDC"/><rect x="288" y="146" width="24" height="24" fill="#B9EEDC"/><rect x="312" y="146" width="24" height="24" fill="#B9EEDC"/><rect x="336" y="146" width="24" height="24" fill="#F7F6F2"/>
<rect x="120" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="144" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="168" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="192" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="216" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="240" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="264" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="288" y="170" width="24" height="24" fill="#DCD9CE"/><rect x="312" y="170" width="24" height="24" fill="#B9EEDC"/><rect x="336" y="170" width="24" height="24" fill="#F7F6F2"/>
