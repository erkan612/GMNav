</g>

<circle cx="132" cy="134" r="7" fill="#D85A30"/>
<text x="132" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">start</text>
<circle cx="324" cy="158" r="7" fill="#1D9E75"/>
<text x="324" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">goal</text>

<rect x="400" y="50" width="18" height="18" rx="4" fill="#DCD9CE" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="428" y="59" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">settled, the cheapest route here is known</text>
<rect x="400" y="82" width="18" height="18" rx="4" fill="#B9EEDC" stroke="#0F6E56" stroke-width="0.5"/>
<text x="428" y="91" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">the frontier, reached but not settled yet</text>
<rect x="400" y="114" width="18" height="18" rx="4" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="428" y="123" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">never looked at</text>

<rect x="400" y="152" width="240" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="418" y="176" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C">Why it stops early</text>
<text x="418" y="198" font-family="sans-serif" font-size="12" fill="#3C3489">The search always settles the cheapest</text>
<text x="418" y="214" font-family="sans-serif" font-size="12" fill="#3C3489">reachable cell next. The moment the goal</text>
<text x="418" y="230" font-family="sans-serif" font-size="12" fill="#3C3489">is the cheapest one left, it is done.</text>

<text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">In the Chapter 1 room, A* settles 56 of the 125 walkable cells before reaching the goal.</text>
<text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The other 69 are never examined at all.</text>
</svg>
