<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The three numbers A star keeps for every cell</title>
<desc>g is the known cost of the route taken so far, h is the estimated cost still remaining, and f is their sum. The search always settles the cell with the smallest f.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>

<circle cx="70" cy="90" r="9" fill="#D85A30"/>
<text x="70" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">start</text>
<circle cx="610" cy="90" r="9" fill="#1D9E75"/>
<text x="610" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">goal</text>

<path d="M79 90 L140 70 L200 105 L260 82 L318 90" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="345" y1="90" x2="598" y2="90" stroke="#73726c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

<circle cx="330" cy="90" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>

<text x="200" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">g, known</text>
<text x="200" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">the real cost of the route</text>
<text x="200" y="157" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">actually taken to get here</text>

<text x="470" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">h, a guess</text>
<text x="470" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">an estimate of what is left,</text>
<text x="470" y="157" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">made without looking at the map</text>

<rect x="70" y="190" width="540" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">f  =  g  +  h</text>
<text x="340" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">the best total cost this route could possibly turn out to have</text>
<text x="340" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">A* always settles the cell with the smallest f, so it works on the most promising route first</text>
</svg>
