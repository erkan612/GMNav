<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why a diagonal step costs more than a straight one</title>
<desc>Two cardinal steps and one diagonal step both move you one cell across and one cell down, but the diagonal covers more ground, so it is priced at the square root of two.</desc>
<rect width="680" height="280" fill="#ffffff"/>

<g stroke="#5F5E5A" stroke-width="0.5" fill="#F1EFE8">
<rect x="90" y="60" width="70" height="70"/><rect x="160" y="60" width="70" height="70"/>
<rect x="90" y="130" width="70" height="70"/><rect x="160" y="130" width="70" height="70"/>
</g>
<circle cx="125" cy="95" r="6" fill="#D85A30"/>
<circle cx="195" cy="165" r="6" fill="#1D9E75"/>
<path d="M125 95 L195 95 L195 159" fill="none" stroke="#5F5E5A" stroke-width="2.5" stroke-linejoin="round"/>
<text x="160" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">two cardinal steps</text>
<text x="160" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">1 + 1 = 2.0</text>

<g stroke="#5F5E5A" stroke-width="0.5" fill="#F1EFE8">
<rect x="410" y="60" width="70" height="70"/><rect x="480" y="60" width="70" height="70"/>
<rect x="410" y="130" width="70" height="70"/><rect x="480" y="130" width="70" height="70"/>
</g>
<circle cx="445" cy="95" r="6" fill="#D85A30"/>
<circle cx="515" cy="165" r="6" fill="#1D9E75"/>
<line x1="445" y1="95" x2="511" y2="161" stroke="#0F6E56" stroke-width="2.5"/>
<text x="480" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">one diagonal step</text>
<text x="480" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">1.414214, not 1.0</text>

<rect x="255" y="90" width="130" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="320" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">same start,</text>
<text x="320" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">same finish,</text>
<text x="320" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">different distance</text>
</svg>
