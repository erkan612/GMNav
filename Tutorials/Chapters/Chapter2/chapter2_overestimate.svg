<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What happens when the estimate is allowed to be too high</title>
<desc>Doubling the heuristic makes the search trust its guess over the map. It takes the short-looking route straight through expensive swamp, at a much higher real cost, and barely saves any work.</desc>
<rect width="680" height="330" fill="#ffffff"/>

<rect x="30" y="46" width="300" height="196" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="46" y="72" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Honest estimate</text>

<rect x="52" y="130" width="256" height="42" fill="#DCD9CE"/>
<text x="180" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">swamp, 8x cost</text>
<rect x="238" y="130" width="26" height="42" fill="#B9EEDC"/>
<circle cx="66" cy="102" r="6" fill="#D85A30"/>
<circle cx="66" cy="212" r="6" fill="#1D9E75"/>
<path d="M66 102 L251 102 L251 200 L72 212" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linejoin="round"/>
<text x="180" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">goes round to the dry crossing</text>

<rect x="350" y="46" width="300" height="196" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="366" y="72" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Estimate doubled</text>

<rect x="372" y="130" width="256" height="42" fill="#DCD9CE"/>
<text x="500" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">swamp, 8x cost</text>
<rect x="558" y="130" width="26" height="42" fill="#B9EEDC"/>
<circle cx="386" cy="102" r="6" fill="#D85A30"/>
<circle cx="386" cy="212" r="6" fill="#1D9E75"/>
<line x1="386" y1="102" x2="386" y2="212" stroke="#993C1D" stroke-width="2.5"/>
<text x="500" y="234" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">ploughs straight through it</text>

<rect x="30" y="258" width="620" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="50" y="280" font-family="sans-serif" font-size="12" fill="#2C2C2A">Real cost 28.485281 against 37.414214, so the doubled version is 31 percent more expensive to walk.</text>
<text x="50" y="300" font-family="sans-serif" font-size="12" fill="#5F5E5A">It settled 79 cells instead of 83. Four cells saved, a third of the path quality gone, and no error reported.</text>
</svg>
