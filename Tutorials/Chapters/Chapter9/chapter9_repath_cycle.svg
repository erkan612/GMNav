<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How an agent repairs itself</title>
<desc>The agent notices its path is stale, requests a replacement, keeps walking the old one meanwhile, and swaps when the new path arrives.</desc>
<defs><marker id="a9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="270" fill="#ffffff"/>

<rect x="34" y="66" width="132" height="66" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="100" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">path goes stale</text>
<text x="100" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">version moved</text>

<line x1="172" y1="99" x2="200" y2="99" stroke="#73726c" stroke-width="1.5" marker-end="url(#a9)"/>

<rect x="206" y="66" width="132" height="66" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="272" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">request a new one</text>
<text x="272" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">HIGH priority, rate limited</text>

<line x1="344" y1="99" x2="372" y2="99" stroke="#73726c" stroke-width="1.5" marker-end="url(#a9)"/>

<rect x="378" y="66" width="132" height="66" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="444" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">keep walking</text>
<text x="444" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">the old path, meanwhile</text>

<line x1="516" y1="99" x2="544" y2="99" stroke="#73726c" stroke-width="1.5" marker-end="url(#a9)"/>

<rect x="550" y="66" width="96" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="598" y="94" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#04342C">swap</text>
<text x="598" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">when it lands</text>

<text x="340" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Walking the stale path for a few frames looks like a character that has not noticed yet, which is exactly right.</text>
<text x="340" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Freezing in place until a replacement arrives looks like a bug.</text>
<text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">Measured: an undisturbed crossing takes 400 frames. Barricaded at frame 90, the agent still arrives, in 439.</text>
</svg>
