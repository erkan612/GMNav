<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why a suspended search can return a path through a new wall</title>
<desc>Cells already settled carry costs and parent links committed under the old world. A wall landing on them is never noticed, because settled cells are never revisited.</desc>
<rect width="680" height="310" fill="#ffffff"/>

<text x="40" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">The search sleeps here</text>
<g stroke="#ffffff" stroke-width="1">
<rect x="50" y="56" width="30" height="30" fill="#DCD9CE"/><rect x="80" y="56" width="30" height="30" fill="#DCD9CE"/><rect x="110" y="56" width="30" height="30" fill="#DCD9CE"/><rect x="140" y="56" width="30" height="30" fill="#B9EEDC"/><rect x="170" y="56" width="30" height="30" fill="#F7F6F2"/>
<rect x="50" y="86" width="30" height="30" fill="#DCD9CE"/><rect x="80" y="86" width="30" height="30" fill="#DCD9CE"/><rect x="110" y="86" width="30" height="30" fill="#DCD9CE"/><rect x="140" y="86" width="30" height="30" fill="#B9EEDC"/><rect x="170" y="86" width="30" height="30" fill="#F7F6F2"/>
<rect x="50" y="116" width="30" height="30" fill="#DCD9CE"/><rect x="80" y="116" width="30" height="30" fill="#DCD9CE"/><rect x="110" y="116" width="30" height="30" fill="#DCD9CE"/><rect x="140" y="116" width="30" height="30" fill="#B9EEDC"/><rect x="170" y="116" width="30" height="30" fill="#F7F6F2"/>
</g>
<text x="115" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">settled, committed</text>

<text x="290" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">A wall lands on settled ground</text>
<g stroke="#ffffff" stroke-width="1">
<rect x="300" y="56" width="30" height="30" fill="#DCD9CE"/><rect x="330" y="56" width="30" height="30" fill="#993C1D" fill-opacity="0.5"/><rect x="360" y="56" width="30" height="30" fill="#DCD9CE"/><rect x="390" y="56" width="30" height="30" fill="#B9EEDC"/><rect x="420" y="56" width="30" height="30" fill="#F7F6F2"/>
<rect x="300" y="86" width="30" height="30" fill="#DCD9CE"/><rect x="330" y="86" width="30" height="30" fill="#993C1D" fill-opacity="0.5"/><rect x="360" y="86" width="30" height="30" fill="#DCD9CE"/><rect x="390" y="86" width="30" height="30" fill="#B9EEDC"/><rect x="420" y="86" width="30" height="30" fill="#F7F6F2"/>
<rect x="300" y="116" width="30" height="30" fill="#DCD9CE"/><rect x="330" y="116" width="30" height="30" fill="#993C1D" fill-opacity="0.5"/><rect x="360" y="116" width="30" height="30" fill="#DCD9CE"/><rect x="390" y="116" width="30" height="30" fill="#B9EEDC"/><rect x="420" y="116" width="30" height="30" fill="#F7F6F2"/>
</g>
<text x="375" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#712B13">never looked at again</text>

<rect x="480" y="56" width="160" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="500" y="80" font-family="sans-serif" font-size="12" fill="#26215C">The frontier ahead</text>
<text x="500" y="100" font-family="sans-serif" font-size="12" fill="#3C3489">respects the new wall.</text>
<text x="500" y="122" font-family="sans-serif" font-size="12" fill="#3C3489">The parent chain behind</text>
<text x="500" y="140" font-family="sans-serif" font-size="12" fill="#3C3489">it does not.</text>

<rect x="40" y="196" width="600" height="92" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="220" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Measured on this chapter's warehouse</text>
<text x="60" y="242" font-family="sans-serif" font-size="12" fill="#5F5E5A">Suspend at 80 pops, drop the barricade, resume: the path comes back clean. Only 3 cells inside the barricade had been settled.</text>
<text x="60" y="260" font-family="sans-serif" font-size="12" fill="#5F5E5A">Suspend at 120 pops instead: 10 cells inside the barricade were already settled, and the returned path crosses 5 of them.</text>
<text x="60" y="278" font-family="sans-serif" font-size="12" fill="#2C2C2A">The fault is not random. It appears exactly when the wall lands on ground the search already committed to.</text>
</svg>
