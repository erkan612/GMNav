<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a search notices the world moved</title>
<desc>The grid keeps a counter that increases whenever anything genuinely changes. A search records the value it started under and compares later.</desc>
<rect width="680" height="260" fill="#ffffff"/>

<rect x="40" y="50" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="72" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">grid.version</text>
<text x="60" y="92" font-family="sans-serif" font-size="12" fill="#5F5E5A">one integer, bumped when a cell is genuinely blocked, unblocked, re-costed or re-flagged</text>

<rect x="40" y="118" width="290" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="142" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">bumps</text>
<text x="60" y="164" font-family="sans-serif" font-size="12" fill="#085041">blocking an open cell</text>
<text x="60" y="182" font-family="sans-serif" font-size="12" fill="#085041">a fill, once for the whole rectangle</text>

<rect x="350" y="118" width="290" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="370" y="142" font-family="sans-serif" font-size="12" font-weight="500" fill="#712B13">does not bump</text>
<text x="370" y="164" font-family="sans-serif" font-size="12" fill="#993C1D">blocking a cell that was already blocked</text>
<text x="370" y="182" font-family="sans-serif" font-size="12" fill="#993C1D">setting a cost to the value it already had</text>

<text x="340" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">That distinction matters. A door object that re-asserts its state every frame would otherwise mark every search stale, forever.</text>
</svg>
