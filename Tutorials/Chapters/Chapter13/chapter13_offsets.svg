<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="330" fill="#FBFAF7"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#3A3A38">A layer is a height. An offset is a fraction of one.</text>

  <line x1="60" y1="240" x2="620" y2="240" stroke="#B4C4A0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="258" font-size="12" fill="#6B7D5A">layer 0</text>

  <line x1="60" y1="120" x2="620" y2="120" stroke="#7F8C9B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="112" font-size="12" fill="#5E6975">layer 1</text>

  <g stroke="#B39A63" stroke-width="1.4" fill="#D9C08F">
    <rect x="150" y="216" width="70" height="24"/>
    <rect x="220" y="192" width="70" height="24"/>
    <rect x="290" y="168" width="70" height="24"/>
    <rect x="360" y="144" width="70" height="24"/>
    <rect x="430" y="120" width="70" height="24"/>
  </g>

  <g font-size="11.5" fill="#6E5C33" text-anchor="middle">
    <text x="185" y="284">-0.8</text>
    <text x="255" y="284">-0.6</text>
    <text x="325" y="284">-0.4</text>
    <text x="395" y="284">-0.2</text>
    <text x="465" y="284">0</text>
  </g>

  <g stroke="#C9B48A" stroke-width="1">
    <line x1="185" y1="240" x2="185" y2="270"/>
    <line x1="255" y1="216" x2="255" y2="270"/>
    <line x1="325" y1="192" x2="325" y2="270"/>
    <line x1="395" y1="168" x2="395" y2="270"/>
    <line x1="465" y1="144" x2="465" y2="270"/>
  </g>

  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#6B6B67">Every cell is on layer 1. The offset says how far below it sits.</text>
</svg>
