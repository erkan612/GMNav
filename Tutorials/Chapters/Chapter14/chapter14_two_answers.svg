<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="300" fill="#FBFAF7"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#3A3A38">Two places the question gets asked</text>

  <rect x="55" y="70" width="250" height="120" rx="6" fill="#E7EDDF" stroke="#B4C4A0" stroke-width="1.5"/>
  <text x="180" y="98" text-anchor="middle" font-size="14" fill="#4A5940">the search</text>
  <text x="180" y="124" text-anchor="middle" font-size="12.5" fill="#5C6B4F">walks the neighbour table</text>
  <text x="180" y="146" text-anchor="middle" font-size="12.5" fill="#5C6B4F">set on the layout</text>
  <text x="180" y="172" text-anchor="middle" font-size="12.5" fill="#3E7D5A">has always obeyed it</text>

  <rect x="375" y="70" width="250" height="120" rx="6" fill="#E7EDDF" stroke="#B4C4A0" stroke-width="1.5"/>
  <text x="500" y="98" text-anchor="middle" font-size="14" fill="#4A5940">the smoothing</text>
  <text x="500" y="124" text-anchor="middle" font-size="12.5" fill="#5C6B4F">draws lines between</text>
  <text x="500" y="146" text-anchor="middle" font-size="12.5" fill="#5C6B4F">waypoints it keeps</text>
  <text x="500" y="172" text-anchor="middle" font-size="12.5" fill="#C0483F">must be told separately</text>

  <path d="M 310 130 L 368 130" stroke="#8A8A86" stroke-width="2" fill="none"/>
  <path d="M 359 123 L 371 130 L 359 137" stroke="#8A8A86" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="340" y="232" text-anchor="middle" font-size="13" fill="#3A3A38">A route that obeys your movement model can still be</text>
  <text x="340" y="252" text-anchor="middle" font-size="13" fill="#3A3A38">shortened into a line that does not.</text>

  <text x="340" y="282" text-anchor="middle" font-size="12.5" fill="#6B6B67">Set the neighbour table for one, the heading count for the other.</text>
</svg>
