<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Independent layers combined into one flat array</title>
<desc>Each layer is authored on its own. A profile multiplies each by that agent type's weight, adds them to the base terrain cost, and flattens the result into a single array the search reads directly.</desc>
<defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="34" y="52" width="150" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="109" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">terrain, the base</text>
<rect x="34" y="100" width="150" height="38" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="109" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">turret threat</text>
<rect x="34" y="148" width="150" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="109" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">enemy territory</text>

<text x="220" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">x 1</text>
<text x="220" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">x 4</text>
<text x="220" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">x 0</text>

<line x1="248" y1="120" x2="300" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#a6)"/>
<text x="274" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">bake</text>

<rect x="312" y="80" width="160" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="392" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">one flat array</text>
<text x="392" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">one number per cell</text>

<line x1="484" y1="120" x2="536" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#a6)"/>

<rect x="548" y="80" width="100" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="598" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">the search</text>
<text x="598" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">one lookup</text>

<rect x="34" y="212" width="614" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="54" y="236" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Why flatten at all</text>
<text x="54" y="258" font-family="sans-serif" font-size="12" fill="#5F5E5A">Resolving layers inside the search would put a loop over every layer inside its innermost loop, so three layers would</text>
<text x="54" y="274" font-family="sans-serif" font-size="12" fill="#5F5E5A">make every path four times slower. Baked, a twelve layer profile costs the search exactly what no profile costs.</text>
</svg>
