<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A threat spread across the cells around it</title>
<desc>A single source writes a value into every cell within its radius, strongest at the centre and fading to nothing at the edge.</desc>
<rect width="680" height="270" fill="#ffffff"/>
<g stroke="#ffffff" stroke-width="1">
<rect x="150" y="50" width="30" height="30" fill="#FDF6F3"/><rect x="180" y="50" width="30" height="30" fill="#FBEDE7"/><rect x="210" y="50" width="30" height="30" fill="#F6DACE"/><rect x="240" y="50" width="30" height="30" fill="#FBEDE7"/><rect x="270" y="50" width="30" height="30" fill="#FDF6F3"/>
<rect x="150" y="80" width="30" height="30" fill="#FBEDE7"/><rect x="180" y="80" width="30" height="30" fill="#F0C4B0"/><rect x="210" y="80" width="30" height="30" fill="#E39C7B"/><rect x="240" y="80" width="30" height="30" fill="#F0C4B0"/><rect x="270" y="80" width="30" height="30" fill="#FBEDE7"/>
<rect x="150" y="110" width="30" height="30" fill="#F6DACE"/><rect x="180" y="110" width="30" height="30" fill="#E39C7B"/><rect x="210" y="110" width="30" height="30" fill="#C25A2C"/><rect x="240" y="110" width="30" height="30" fill="#E39C7B"/><rect x="270" y="110" width="30" height="30" fill="#F6DACE"/>
<rect x="150" y="140" width="30" height="30" fill="#FBEDE7"/><rect x="180" y="140" width="30" height="30" fill="#F0C4B0"/><rect x="210" y="140" width="30" height="30" fill="#E39C7B"/><rect x="240" y="140" width="30" height="30" fill="#F0C4B0"/><rect x="270" y="140" width="30" height="30" fill="#FBEDE7"/>
<rect x="150" y="170" width="30" height="30" fill="#FDF6F3"/><rect x="180" y="170" width="30" height="30" fill="#FBEDE7"/><rect x="210" y="170" width="30" height="30" fill="#F6DACE"/><rect x="240" y="170" width="30" height="30" fill="#FBEDE7"/><rect x="270" y="170" width="30" height="30" fill="#FDF6F3"/>
</g>
<text x="225" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#ffffff">20</text>
<text x="225" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">one turret, one stamp</text>

<rect x="350" y="60" width="290" height="140" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="370" y="86" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C">An influence map</text>
<text x="370" y="110" font-family="sans-serif" font-size="12" fill="#3C3489">is just a number per cell, describing</text>
<text x="370" y="128" font-family="sans-serif" font-size="12" fill="#3C3489">how much something matters there.</text>
<text x="370" y="156" font-family="sans-serif" font-size="12" fill="#3C3489">Threat, cover, ownership, noise,</text>
<text x="370" y="174" font-family="sans-serif" font-size="12" fill="#3C3489">whatever your game cares about.</text>

<text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The turret in this chapter writes into 121 cells, peaking at 20 and fading to zero six cells out.</text>
</svg>
