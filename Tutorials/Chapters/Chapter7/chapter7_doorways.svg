<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Four unit sizes choosing between three doorways</title>
<desc>One navigation grid serves every size. Small units take the nearest gap, larger ones detour to a wider one, and the largest finds no route at all.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="300" y="40" width="26" height="30" fill="#993C1D" opacity="0.35"/>
<rect x="300" y="96" width="26" height="52" fill="#993C1D" opacity="0.35"/>
<rect x="300" y="174" width="26" height="86" fill="#993C1D" opacity="0.35"/>

<circle cx="60" cy="150" r="5" fill="#D85A30"/>
<path d="M66 150 L280 158 L340 158 L610 150" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round"/>
<path d="M66 150 L280 122 L340 122 L610 150" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linejoin="round"/>
<path d="M66 150 L250 216 L370 216 L610 150" fill="none" stroke="#534AB7" stroke-width="2" stroke-linejoin="round"/>
<circle cx="610" cy="150" r="5" fill="#1D9E75"/>

<g>
<rect x="348" y="74" width="150" height="16" fill="#ffffff"/>
<text x="352" y="86" font-family="sans-serif" font-size="11" fill="#712B13">gap A, 1 cell, clearance 1</text>
<rect x="348" y="104" width="156" height="15" fill="#ffffff"/>
<text x="352" y="116" font-family="sans-serif" font-size="11" fill="#712B13">gap B, 3 cells, clearance 2</text>
<rect x="348" y="266" width="156" height="16" fill="#ffffff"/>
<text x="352" y="278" font-family="sans-serif" font-size="11" fill="#712B13">gap C, 5 cells, clearance 3</text>
</g>
<rect x="40" y="42" width="180" height="86" rx="8" fill="#F7F6F2" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="62" font-family="sans-serif" font-size="11" fill="#085041">clearance 1, row 9, 30 cells</text>
<text x="56" y="80" font-family="sans-serif" font-size="11" fill="#04342C">clearance 2, row 8, 30 cells</text>
<text x="56" y="98" font-family="sans-serif" font-size="11" fill="#26215C">clearance 3, row 15, 36 cells</text>
<text x="56" y="116" font-family="sans-serif" font-size="11" fill="#712B13">clearance 4, no route at all</text>
</svg>
