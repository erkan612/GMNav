<svg width="680" height="290" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What a clearance value means</title>
<desc>Clearance is the largest odd square of open cells that fits centred on this cell. One means a single cell, two means three by three, three means five by five.</desc>
<rect width="680" height="290" fill="#ffffff"/>

<g stroke="#ffffff" stroke-width="1.5" fill="#B9EEDC"><rect x="70" y="90" width="26" height="26"/></g>
<rect x="70" y="90" width="26" height="26" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="83" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">1</text>
<text x="83" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">1 x 1 fits</text>

<g stroke="#ffffff" stroke-width="1.5" fill="#B9EEDC">
<rect x="220" y="64" width="26" height="26"/><rect x="246" y="64" width="26" height="26"/><rect x="272" y="64" width="26" height="26"/>
<rect x="220" y="90" width="26" height="26"/><rect x="246" y="90" width="26" height="26"/><rect x="272" y="90" width="26" height="26"/>
<rect x="220" y="116" width="26" height="26"/><rect x="246" y="116" width="26" height="26"/><rect x="272" y="116" width="26" height="26"/>
</g>
<rect x="246" y="90" width="26" height="26" fill="#1D9E75"/>
<text x="259" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">2</text>
<text x="259" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">3 x 3 fits</text>

<g stroke="#ffffff" stroke-width="1.5" fill="#B9EEDC">
<rect x="430" y="38" width="26" height="26"/><rect x="456" y="38" width="26" height="26"/><rect x="482" y="38" width="26" height="26"/><rect x="508" y="38" width="26" height="26"/><rect x="534" y="38" width="26" height="26"/>
<rect x="430" y="64" width="26" height="26"/><rect x="456" y="64" width="26" height="26"/><rect x="482" y="64" width="26" height="26"/><rect x="508" y="64" width="26" height="26"/><rect x="534" y="64" width="26" height="26"/>
<rect x="430" y="90" width="26" height="26"/><rect x="456" y="90" width="26" height="26"/><rect x="482" y="90" width="26" height="26"/><rect x="508" y="90" width="26" height="26"/><rect x="534" y="90" width="26" height="26"/>
<rect x="430" y="116" width="26" height="26"/><rect x="456" y="116" width="26" height="26"/><rect x="482" y="116" width="26" height="26"/><rect x="508" y="116" width="26" height="26"/><rect x="534" y="116" width="26" height="26"/>
<rect x="430" y="142" width="26" height="26"/><rect x="456" y="142" width="26" height="26"/><rect x="482" y="142" width="26" height="26"/><rect x="508" y="142" width="26" height="26"/><rect x="534" y="142" width="26" height="26"/>
</g>
<rect x="482" y="90" width="26" height="26" fill="#1D9E75"/>
<text x="495" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">3</text>
<text x="495" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">5 x 5 fits</text>

<rect x="40" y="234" width="600" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="254" font-family="sans-serif" font-size="12" fill="#2C2C2A">Zero means blocked. Out of bounds counts as blocked, so every cell on the border is 1.</text>
<text x="60" y="270" font-family="sans-serif" font-size="12" fill="#5F5E5A">A doorway three cells wide has clearance 2 at its centre and 1 at its edges.</text>
</svg>
