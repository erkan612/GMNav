<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A point agent and a wide agent given the same route</title>
<desc>Pathfinding treats a unit as a point, so a route through a one cell gap is valid. A unit four cells wide following that route walks through the walls on either side.</desc>
<rect width="680" height="260" fill="#ffffff"/>
<text x="40" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">The route the search returns</text>
<text x="390" y="40" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">The unit that has to walk it</text>

<g stroke="#5F5E5A" stroke-width="0.5" fill="#993C1D" fill-opacity="0.35">
<rect x="150" y="60" width="30" height="70"/><rect x="150" y="160" width="30" height="70"/>
</g>
<line x1="60" y1="145" x2="300" y2="145" stroke="#0F6E56" stroke-width="2.5"/>
<circle cx="60" cy="145" r="5" fill="#1D9E75"/>
<text x="180" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">valid for something with no width</text>

<g stroke="#5F5E5A" stroke-width="0.5" fill="#993C1D" fill-opacity="0.35">
<rect x="500" y="60" width="30" height="70"/><rect x="500" y="160" width="30" height="70"/>
</g>
<line x1="410" y1="145" x2="650" y2="145" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="515" cy="145" r="42" fill="#D85A30" fill-opacity="0.4" stroke="#993C1D" stroke-width="1.5"/>
<text x="530" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">the same route, through both walls</text>
</svg>
