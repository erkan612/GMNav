<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="320" fill="#FBFAF7"/>
  <text x="340" y="32" text-anchor="middle" font-size="15" fill="#3A3A38">Two questions the framework can answer</text>

  <path d="M 100 235 L 590 165" stroke="#5E6975" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 100 235 L 305 105 L 590 165" stroke="#3E7D5A" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>

  <circle cx="100" cy="235" r="8" fill="#3A3A38"/>
  <circle cx="305" cy="105" r="9" fill="#3E7D5A"/>
  <circle cx="590" cy="165" r="8" fill="#A03A32"/>

  <text x="100" y="268" text-anchor="middle" font-size="12.5" fill="#3A3A38">the unit</text>
  <text x="305" y="88" text-anchor="middle" font-size="12.5" fill="#3E7D5A">the heal zone</text>
  <text x="590" y="196" text-anchor="middle" font-size="12.5" fill="#A03A32">the target</text>

  <text x="330" y="214" font-size="12.5" fill="#5E6975">cost straight there</text>
  <text x="62" y="88" font-size="12.5" fill="#3E7D5A">cost there and back out</text>

  <text x="340" y="298" text-anchor="middle" font-size="12.5" fill="#6B6B67">The difference is what the detour costs. Whether it is worth paying is yours.</text>
</svg>
